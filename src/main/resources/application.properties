spring.application.name=tienda-celulares

# Puerto local o asignado por Render
server.port=${PORT:8080}

# Conexion configurable a la base de datos
# Local: MariaDB / XAMPP
# Nube: TiDB Cloud / MySQL
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/tienda_celulares}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# El controlador JDBC se detecta segun el prefijo de DB_URL

# Formato de fechas
spring.jackson.serialization.write-dates-as-timestamps=false
